{{ define "main" }}
<h1>{{ site.Title }}</h1>
{{ .Content }}
<h2>Projects</h2>
<ul class="projects">
    {{ range site.RegularPages.ByWeight }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a> — {{ .Description }}</li>
    {{ end }}
</ul>
<p class="links">
    <a href="{{ site.Params.cardURL }}">vasar.dev</a> ·
    <a href="{{ site.Params.linkedinURL }}">LinkedIn</a>
</p>
{{ with site.Params.lastUpdated }}
<p class="updated">Last updated: <time datetime="{{ . }}">{{ time.Format "2 January 2006" . }}</time></p>
{{ end }}
{{ end }}
